name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Katas, questions and examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: katas/pom.xml

      - name: Verify every kata fails unsolved and passes with its reference solution
        run: MIN_KATAS=74 bash scripts/verify-katas.sh

      - name: Build the build-tools playground (multi-module Maven, enforcer rules)
        run: katas/mvnw -B -f tracks/03-build-tools/playground verify

      - name: Publish failing tests as annotations
        if: failure()
        run: |
          shopt -s nullglob
          for f in katas/target/surefire-reports/*.txt; do
            if grep -qE "<<< (FAILURE|ERROR)" "$f"; then
              msg=$(grep -E -A8 "<<< (FAILURE|ERROR)" "$f" | head -60 | cut -c1-300 | tr '\n' '|')
              echo "::error title=$(basename "$f")::${msg:0:3000}"
            fi
          done
